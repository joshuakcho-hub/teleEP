[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teleep"
version = "1.0.0"
description = "Open-source analysis of implantable telemetry ECG: DSI Ponemah to EDF conversion, filtering, R-peak and P-wave detection, RR interval and heart rate variability analysis, and data export."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Joshua Kyungjoon Cho" },
    { name = "Hee Cheol Cho" },
]
keywords = [
    "ECG", "telemetry", "heart rate variability", "HRV", "RR interval",
    "EDF", "Ponemah", "electrophysiology", "atrioventricular block",
    "sinus node dysfunction", "large animal", "swine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
window = ["pywebview>=4.0"]
test = ["pytest>=7"]

[project.scripts]
teleep = "teleep.cli:main"

[project.gui-scripts]
teleep-gui = "teleep.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teleep = ["viewer/*.html", "annotator/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
